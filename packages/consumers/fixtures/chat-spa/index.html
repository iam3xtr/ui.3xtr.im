<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>consumer-chat-spa-fixture</title>
    <!-- Synchronous pre-paint theme: consumer-owned mirror of src/theme.js
         (modeFromSearch + resolveTheme); keep both in sync. -->
    <script>
      (function () {
        var m = new URLSearchParams(location.search).get("theme");
        var dark = m === "dark" || ((m !== "light") && typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
